name: mandimitra
services:
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    env_file: .env
    environment:
      DEPLOYMENT_ENV: production
      DATABASE_PATH: /app/runtime/mandimitra.db
      API_INTERNAL_TOKEN: ${API_INTERNAL_TOKEN:?Run prepare-env.py --private first}
      APP_SESSION_SECRET: ${APP_SESSION_SECRET:?Run prepare-env.py --private first}
      APP_ACCESS_CODE: ${APP_ACCESS_CODE:?Run prepare-env.py --private first}
      CORS_ORIGINS: https://${APP_DOMAIN:?Set APP_DOMAIN in .env}
    volumes:
      - farmer-data:/app/runtime
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    env_file: .env
    environment:
      DEPLOYMENT_ENV: production
      API_BASE_URL: http://api:8000
      APP_PUBLIC_URL: https://${APP_DOMAIN:?Set APP_DOMAIN in .env}
      API_INTERNAL_TOKEN: ${API_INTERNAL_TOKEN:?Run prepare-env.py --private first}
      APP_SESSION_SECRET: ${APP_SESSION_SECRET:?Run prepare-env.py --private first}
      APP_ACCESS_CODE: ${APP_ACCESS_CODE:?Run prepare-env.py --private first}
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  caddy:
    image: caddy:2-alpine
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
    restart: unless-stopped
volumes:
  farmer-data:
  caddy-data:
  caddy-config:
